[project]
name = "jarvis-personal-ai-os"
version = "0.8.0.dev0"
description = "Product-owned JARVIS Personal AI OS runtime for private local evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JARVIS project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "tzdata>=2024.1"]

[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project]
name = "jarvis-personal-ai-os"
version = "0.8.0.dev0"
description = "Product-owned JARVIS Personal AI OS runtime for private local evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JARVIS project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "tzdata>=2024.1"]
computer-uia = [
    "uiautomation==2.0.29",
]
computer-ocr = [
    # Batch 06 (R18B05-002): torch/torchvision pinned exactly, not left to
    # EasyOCR's own unpinned/broadly-constrained requirements, so future
    # setup cannot silently resolve a different or CUDA-heavy PyTorch
    # runtime. These exact versions were verified (2026-09-13, NIGHTFURY,
    # Windows, plain PyPI, no alternate index) to resolve the same CPU-only
    # build DEC-048's accepted evidence was produced on -
    # `torch.__version__ == "2.14.0+cpu"`, `torchvision.__version__ ==
    # "0.29.0+cpu"`, `torch.version.cuda is None`. See
    # `scripts/setup/provision_easyocr_models.py` and
    # `tests/test_phase_eighteen_ocr_reproducibility.py`.
    "easyocr==1.7.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
]
voice = [
    "sounddevice==0.5.6",
    "onnxruntime==1.29.0",
    "openwakeword==0.6.0",
    "faster-whisper==1.2.1",
    "piper-tts==1.7.0",
]

[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis" = ["ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project]
name = "jarvis-personal-ai-os"
version = "0.8.0.dev0"
description = "Product-owned JARVIS Personal AI OS runtime for private local evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JARVIS project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "tzdata>=2024.1"]
voice = [
    "sounddevice==0.5.6",
    "onnxruntime==1.29.0",
    "openwakeword==0.6.0",
    "faster-whisper==1.2.1",
    "piper-tts==1.7.0",
]

[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis" = ["ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
